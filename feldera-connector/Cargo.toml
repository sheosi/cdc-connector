[package]
name = "feldera-connector"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
feldera-rest-api = "0.346.0"
reqwest = "0.12.28"
cdc-avro = {path = "../cdc-avro"}
feldera-types = "0.346.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
cdc-sink = {path = "../cdc-sink"}
thiserror = "2.0.20"
config = "0.15.25"

# Pre alloc vec
bumpalo = { version = "3.20.3", features = ["collections", "serde"] }
metrics-exporter-prometheus = "0.18.3"
metrics = "0.24.6"
