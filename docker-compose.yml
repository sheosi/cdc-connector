services:
  postgres-source:
    image: docker.io/library/postgres:16
    container_name: cdc-postgres-source
    environment:
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
      POSTGRES_DB: cdc
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "5400:5432"
    volumes:
      - ./scripts/init-source.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdc -d cdc"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-sink:
    image: docker.io/library/postgres:16
    container_name: cdc-postgres-sink
    environment:
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
      POSTGRES_DB: cdc
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    ports:
      - "5401:5432"
    volumes:
      - ./scripts/init-sink.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdc -d cdc"]
      interval: 5s
      timeout: 5s
      retries: 10

  feldera:
    image: images.feldera.com/feldera/pipeline-manager:latest
    stop_grace_period: 0s
    container_name: cdc-feldera
    ports:
      - "8081:8080"
    command:
      - --allowed-origins
      - "http://localhost:8081"
    environment:
      - RUST_LOG=info,actix_web=error,tokio_postgres=info
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --request GET --url http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  feldera-init:
    image: docker.io/curlimages/curl:latest
    container_name: cdc-feldera-init
    depends_on:
      feldera:
        condition: service_healthy
    volumes:
      - ./docker/feldera/init.sh:/init.sh:ro
      - ./docker/feldera/feldera-pipeline.json:/pipeline.json:ro

    entrypoint: ["sh", "/init.sh"]
    restart: "no"


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.9
    container_name: cdc-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAIN://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAIN://redpanda:29092,OUTSIDE://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"   # Kafka API, host -> container (use this from your host)
      - "29092:29092" # Kafka API, in-network
      - "9644:9644"   # admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    container_name: cdc-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8079:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  cdc-producer:
    environment:
      CDC_PROD_WILL_CONNECT_TO_FELDERA: "false"
      CDC_PROD_POSTGRES_HOST: "postgres-source"
      CDC_PROD_POSTGRES_USER: "cdc"
      CDC_PROD_POSTGRES_PASSWORD: "cdc"
      CDC_PROD_POSTGRES_SLOTNAME: "cdc_slot"
      CDC_PROD_POSTGRES_DBNAME: "cdc"
      CDC_PROD_POSTGRES_PUBLICATION: "cdc_pub"
      CDC_PROD_POSTGRES_PORT: 5432
      CDC_PROD_KAFKA_BROKERS: "redpanda:29092"
      CDC_PROD_KAFKA_TOPIC: "example-topic"
      CDC_PROD_KAFKA_KEY: "default"

    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdc-producer
    command: ["/app/cdc-producer"]
    ports:
      - "9000:9000"
    depends_on:
      postgres-source:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  postgres-connector:
    environment:
      PG_CONN_POSTGRES_HOST: "postgres-sink"
      PG_CONN_POSTGRES_USER: "cdc"
      PG_CONN_POSTGRES_PASSWORD: "cdc"
      PG_CONN_POSTGRES_PORT: 5432
      PG_CONN_KAFKA_BROKERS: "redpanda:29092"
      PG_CONN_METRICS_PORT: "9000"
      PG_CONN_KAFKA_TOPIC: "example-topic"
      PG_CONN_KAFKA_GROUPID: "default"

    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdc-postgres-connector
    command: ["/app/postgres-connector"]
    ports:
      - "9001:9000"
    depends_on:
      postgres-sink:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  feldera-connector:
    environment:
      FELD_CONN_KAFKA_BROKERS: "redpanda:29092"
      FELD_CONN_KAFKA_TOPIC: "example-topic"
      FELD_CONN_KAFKA_GROUPID: "feldera"
      FELD_CONN_METRICS_PORT: "9002"
      FELD_CONN_FELDERA_URL: "http://feldera:8080"
      FELD_CONN_FELDERA_PIPELINE: "cdc-pipeline"

    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdc-feldera-connector
    command: ["/app/feldera-connector"]
    ports:
      - "9002:9002"
    depends_on:
      redpanda:
        condition: service_healthy
      feldera:
        condition: service_healthy
      feldera-init:
        condition: service_completed_successfully

  prometheus:
    image: docker.io/prom/prometheus:v2.55.0
    container_name: cdc-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:11.1.0
    container_name: cdc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
